name: Build GlowTray

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ matrix.architecture }} release
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
          - architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify tagged commit belongs to master
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/master
          if ($LASTEXITCODE -eq 1) { throw 'Release tags must point to a commit on master.' }
          if ($LASTEXITCODE -ne 0) { throw "Could not verify master ancestry (exit $LASTEXITCODE)." }

      - name: Build release and run native regression tests
        run: .\native\build.ps1 -Architecture ${{ matrix.architecture }}

      - name: Verify tag matches the application version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $executable = (Get-Item 'artifacts\GlowTray\${{ matrix.architecture }}\GlowTray.exe').FullName
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($executable).ProductVersion
          if ($env:RELEASE_TAG -cne "v$version") {
            throw "Release tag '$env:RELEASE_TAG' must match the application version 'v$version'."
          }

      - name: Package per-user EXE installer
        run: .\native\package.ps1 -Architecture ${{ matrix.architecture }}

      - name: Check installer, upgrade, and uninstall
        run: |
          $installer = (Get-ChildItem 'artifacts\installers\${{ matrix.architecture }}\*-Setup.exe').FullName
          .\native\InstallerSmoke.ps1 -Installer $installer -Architecture ${{ matrix.architecture }}

      - name: Check native HTTP integration and UI
        run: .\native\UiSmoke.ps1 -Architecture ${{ matrix.architecture }}

      - name: Upload portable executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GlowTray-windows-${{ matrix.architecture }}
          path: artifacts\GlowTray\${{ matrix.architecture }}\GlowTray.exe
          if-no-files-found: error

      - name: Upload EXE installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GlowTray-setup-windows-${{ matrix.architecture }}
          path: artifacts\installers\${{ matrix.architecture }}\*-Setup.exe
          if-no-files-found: error

      - name: Upload installer logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GlowTray-installer-logs-${{ matrix.architecture }}
          path: artifacts\installer-smoke\${{ matrix.architecture }}\*.log
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested executables and installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: GlowTray-*
          path: artifacts\release

      - name: Publish versioned release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $assets = foreach ($architecture in @('x64', 'arm64')) {
            $portable = "artifacts\release\GlowTray-windows-$architecture\GlowTray-$version-$architecture.exe"
            Copy-Item "artifacts\release\GlowTray-windows-$architecture\GlowTray.exe" $portable
            $portable
            (Get-Item "artifacts\release\GlowTray-setup-windows-$architecture\GlowTray-$version-$architecture-Setup.exe").FullName
          }
          gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --verify-tag --title "GlowTray $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publishing failed (exit $LASTEXITCODE)." }
